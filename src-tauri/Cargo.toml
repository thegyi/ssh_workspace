[package]
name = "ssh-workspace"
version = "0.1.0"
description = "SSH workspace with host management and multi-terminal console"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
dirs = "6"

# Windows runners have no reliably discoverable OpenSSL for openssl-sys;
# build it from source there (Linux keeps linking the system libssl3).
[target.'cfg(windows)'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
