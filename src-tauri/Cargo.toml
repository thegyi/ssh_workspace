[package]
name = "ssh-workspace"
version = "0.1.0"
description = "SSH workspace with host management and multi-terminal console"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
dirs = "6"
