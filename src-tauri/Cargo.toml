[package]
name = "ssh-workspace"
version = "1.0.0"
description = "SSH workspace with host management and multi-terminal console"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
dirs = "6"
# No default features: libudev (Linux USB metadata) would pull a C dep;
# port enumeration still works without it.
serialport = { version = "4", default-features = false }

# Windows/macOS runners have no reliably discoverable OpenSSL for
# openssl-sys; build it from source there (Linux links system libssl3).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

# keyring has NO default backend: without a store feature it silently
# uses an in-memory mock, so secrets would not survive a restart.
# Linux/BSD → Secret Service (GNOME Keyring/KDE Wallet) over D-Bus.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
