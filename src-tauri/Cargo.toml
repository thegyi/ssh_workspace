[package]
name = "ssh-workspace"
version = "0.1.0"
description = "SSH workspace with host management and multi-terminal console"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
dirs = "6"

# Windows/macOS runners have no reliably discoverable OpenSSL for
# openssl-sys; build it from source there (Linux links system libssl3).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

# keyring default features pull libdbus (Secret Service) — that only
# exists on Linux/BSD, so enable per-platform backends.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
