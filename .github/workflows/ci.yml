name: CI

on:
  push:
    branches: [main, master]
    tags: ["release-*", "Release-*", "v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libssl-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend JS syntax
        run: node --check ui/main.js

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

  build:
    name: Build Linux bundles
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libssl-dev libfuse2 librsvg2-dev patchelf pkg-config \
            libdbus-1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run build

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: ssh-workspace-linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  build-windows:
    name: Build Windows bundles
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # npm run build has a bash-style PATH prefix that fails in cmd/pwsh;
      # the runner's cargo is already on PATH so call the CLI directly.
      # --bundles overrides the Linux-only targets list in tauri.conf.json.
      - name: Build Tauri app
        run: npx tauri build --bundles nsis,msi

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: ssh-workspace-windows-bundles
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-macos:
    name: Build macOS bundles
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # --bundles overrides the Linux-only targets list in tauri.conf.json.
      - name: Build Tauri app
        run: npx tauri build --bundles app,dmg

      # upload-artifact would spill the .app's loose files (Info.plist,
      # icon.icns, the binary) into the release; ditto -c -k also preserves
      # exec bits and symlinks that a plain artifact upload would lose.
      - name: Archive .app bundle
        run: |
          cd src-tauri/target/release/bundle/macos
          for app in *.app; do
            ditto -c -k --keepParent "$app" "${app%.app}.zip"
          done

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: ssh-workspace-macos-bundles
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.zip
          if-no-files-found: warn

  # On tag pushes (release-*/v*), collect the platform bundles built above
  # into a GitHub Release using RELEASE_NOTES.md as the body.
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v6
        with:
          pattern: ssh-workspace-*-bundles
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/**/*
