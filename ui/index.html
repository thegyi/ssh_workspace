<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>SSH Workspace</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">SSH Workspace</div>
      <button id="add-host-btn" class="btn primary">+ Add host</button>
      <ul id="host-list"></ul>
    </aside>
    <main id="main">
      <div id="tabs"></div>
      <div id="panes"></div>
      <div id="empty-state">
        <div class="empty-inner">
          <h2>No sessions</h2>
          <p>Click a host on the left to open a terminal.</p>
        </div>
      </div>
    </main>
  </div>

  <div id="host-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h3 id="host-modal-title">Add host</h3>
      <form id="host-form">
        <label>Name
          <input id="f-name" required placeholder="prod-web-1">
        </label>
        <div class="row">
          <label class="grow">Host
            <input id="f-host" required placeholder="example.com">
          </label>
          <label class="w-port">Port
            <input id="f-port" type="number" value="22" min="1" max="65535" required>
          </label>
        </div>
        <label>Username
          <input id="f-user" required placeholder="ubuntu">
        </label>
        <div class="field">
          <span class="field-label">Authentication</span>
          <div class="segmented" id="f-auth">
            <button type="button" data-value="password">Password</button>
            <button type="button" data-value="key">Private key</button>
            <button type="button" data-value="agent">SSH agent</button>
          </div>
        </div>
        <div id="f-password-row">
          <label>Password
            <input id="f-password" type="password" autocomplete="off" placeholder="leave empty to be asked at connect">
          </label>
        </div>
        <div id="f-key-row" hidden>
          <label>Private key path
            <input id="f-key-path" placeholder="~/.ssh/id_ed25519">
          </label>
          <label>Passphrase
            <input id="f-passphrase" type="password" autocomplete="off" placeholder="optional">
          </label>
        </div>
        <p class="hint">Secrets are stored in plaintext in hosts.json.</p>
        <div class="modal-actions">
          <button type="button" class="btn" id="host-cancel">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="secret-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h3 id="secret-title">Password</h3>
      <form id="secret-form">
        <input id="secret-input" type="password" autocomplete="off">
        <div class="modal-actions">
          <button type="button" class="btn" id="secret-cancel">Cancel</button>
          <button type="submit" class="btn primary">Connect</button>
        </div>
      </form>
    </div>
  </div>

  <div id="text-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h3 id="text-title">Name</h3>
      <form id="text-form">
        <input id="text-input" type="text" autocomplete="off" spellcheck="false">
        <div class="modal-actions">
          <button type="button" class="btn" id="text-cancel">Cancel</button>
          <button type="submit" class="btn primary">OK</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="main.js"></script>
</body>

</html>
